<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>文件浏览</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#16181A;text-decoration:none}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; color: #16181A; font-family: 'Noto Sans SC', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <header style="padding: 16px 12px 8px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="Main.dc.html" aria-label="返回存储桶" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 500">photos-2026</span>
        <span style="font-size: 12px; color: #5C6066">us-east-1 · 私有</span>
      </div>
      <sc-if value="{{selecting}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{toggleSelect}}" style="height: 44px; padding: 0 14px; border: none; background: transparent; font: inherit; font-size: 15px; font-weight: 500; color: {{accent}}">完成</button>
      </sc-if>
      <sc-if value="{{notSelecting}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{toggleSelect}}" style="height: 44px; padding: 0 14px; border: none; background: transparent; font: inherit; font-size: 15px; color: #16181A">选择</button>
      </sc-if>
    </div>

    <nav aria-label="路径" style="display: flex; align-items: center; gap: 4px; padding: 0 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #5C6066; white-space: nowrap; overflow: hidden">
      <a href="#" style="color: #5C6066">/</a>
      <span aria-hidden="true">›</span>
      <a href="#" style="color: #5C6066">trips</a>
      <span aria-hidden="true">›</span>
      <span style="color: #16181A; font-weight: 500">kyoto</span>
    </nav>

    <div style="display: flex; gap: 8px; padding: 0 8px">
      <label style="flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; background: #FFFFFF; border: 1px solid #D9DBD5; border-radius: 12px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C6066" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">搜索此文件夹</span>
        <input type="search" placeholder="按前缀搜索" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 15px; color: #16181A">
      </label>
      <button type="button" aria-label="排序与视图" style="width: 44px; height: 44px; border: 1px solid #D9DBD5; border-radius: 12px; background: #FFFFFF; color: #16181A; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
      </button>
    </div>
  </header>

  <div style="padding: 4px 20px 8px; display: flex; justify-content: space-between; font-size: 12px; color: #5C6066">
    <span>2 个文件夹 · 6 个文件</span>
    <span>按修改时间 ↓</span>
  </div>

  <ul style="list-style: none; margin: 0; padding: 0 12px; display: flex; flex-direction: column; flex: 1; overflow: hidden">
    <sc-for list="{{items}}" as="f" hint-placeholder-count="8">
      <li style="border-bottom: 1px solid #E3E5DF">
        <sc-if value="{{f.asLink}}" hint-placeholder-val="{{ true }}">
          <a href="{{f.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px">
            <span style="width: 40px; height: 40px; flex: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; background: {{f.badgeBg}}; color: {{f.badgeFg}}">
              <sc-if value="{{f.isFolder}}" hint-placeholder-val="{{ false }}">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
              </sc-if>
              <sc-if value="{{f.isFile}}" hint-placeholder-val="{{ true }}">{{f.ext}}</sc-if>
            </span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.name}}</span>
              <span style="font-size: 12px; color: #5C6066">{{f.meta}}</span>
            </span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8E93" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
          </a>
        </sc-if>
        <sc-if value="{{f.asCheck}}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{f.toggle}}" aria-pressed="{{f.pressed}}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px; border: none; background: {{f.rowBg}}; border-radius: 10px; font: inherit; color: inherit; text-align: left">
            <span style="width: 22px; height: 22px; flex: none; border-radius: 11px; box-sizing: border-box; border: 2px solid {{f.checkBorder}}; background: {{f.checkBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
            </span>
            <span style="width: 40px; height: 40px; flex: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; background: {{f.badgeBg}}; color: {{f.badgeFg}}">{{f.ext}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.name}}</span>
              <span style="font-size: 12px; color: #5C6066">{{f.meta}}</span>
            </span>
          </button>
        </sc-if>
      </li>
    </sc-for>
  </ul>

  <sc-if value="{{notSelecting}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; right: 20px; bottom: 28px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px">
      <button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #D9DBD5; border-radius: 22px; background: #FFFFFF; font: inherit; font-size: 14px; color: #16181A; display: flex; align-items: center; gap: 6px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        新建文件夹
      </button>
      <button type="button" style="height: 56px; padding: 0 22px; border: none; border-radius: 28px; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 16px rgba(22,24,26,0.18)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>
        上传
      </button>
    </div>
  </sc-if>

  <sc-if value="{{selecting}}" hint-placeholder-val="{{ false }}">
    <div style="padding: 10px 12px 26px; background: #16181A; color: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
      <span style="padding: 0 8px; font-size: 13px; color: #C9CCC4">已选 {{pickedCount}} 项 · {{pickedSize}}</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
        <button type="button" style="height: 52px; border: none; border-radius: 10px; background: transparent; color: #FFFFFF; font: inherit; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5"></path><path d="M4 20h16"></path></svg>下载</button>
        <a href="Share.dc.html" style="height: 52px; border-radius: 10px; color: #FFFFFF; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>分享</a>
        <button type="button" style="height: 52px; border: none; border-radius: 10px; background: transparent; color: #FFFFFF; font: inherit; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>移动</button>
        <button type="button" style="height: 52px; border: none; border-radius: 10px; background: transparent; color: #FCA5A5; font: inherit; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6"></path><path d="M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>删除</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#1D4ED8","#0F766E","#16181A"]},"startSelecting":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selecting: null, picked: { 'IMG_0412.jpg': true, 'IMG_0418.jpg': true } };
  }
  renderVals() {
    const accent = this.props.accent ?? '#C2410C';
    const selecting = this.state.selecting === null ? !!this.props.startSelecting : this.state.selecting;
    const picked = this.state.picked;
    const kinds = {
      folder: ['#ECEEE9', '#16181A'],
      img: ['#FDEBDD', '#9A3412'],
      vid: ['#E0E7FF', '#1E3A8A'],
      doc: ['#E2E8F0', '#1E293B'],
      zip: ['#DCFCE7', '#14532D']
    };
    const raw = [
      { name: 'raw/', meta: '38 个对象', kind: 'folder' },
      { name: 'edited/', meta: '12 个对象', kind: 'folder' },
      { name: 'IMG_0412.jpg', meta: '4.2 MB · 今天 09:14', kind: 'img', ext: 'JPG', bytes: 4.2 },
      { name: 'IMG_0418.jpg', meta: '3.9 MB · 今天 09:20', kind: 'img', ext: 'JPG', bytes: 3.9 },
      { name: 'arashiyama.mov', meta: '286 MB · 昨天', kind: 'vid', ext: 'MOV', bytes: 286 },
      { name: 'itinerary.pdf', meta: '640 KB · 10月28日', kind: 'doc', ext: 'PDF', bytes: 0.6 },
      { name: 'receipts.zip', meta: '12.8 MB · 10月26日', kind: 'zip', ext: 'ZIP', bytes: 12.8 },
      { name: 'IMG_0399.heic', meta: '2.7 MB · 10月25日', kind: 'img', ext: 'HEIC', bytes: 2.7 }
    ];
    const items = raw
      .filter((r) => !selecting || r.kind !== 'folder')
      .map((r) => {
        const on = !!picked[r.name];
        const isFolder = r.kind === 'folder';
        return {
          ...r,
          isFolder,
          isFile: !isFolder,
          ext: r.ext || '',
          href: isFolder ? '#' : 'FileActions.dc.html',
          badgeBg: kinds[r.kind][0],
          badgeFg: kinds[r.kind][1],
          asLink: !selecting,
          asCheck: selecting,
          pressed: on ? 'true' : 'false',
          rowBg: on ? '#FFFFFF' : 'transparent',
          checkBorder: on ? accent : '#B4B8B0',
          checkBg: on ? accent : 'transparent',
          toggle: () => this.setState({ picked: { ...picked, [r.name]: !on } })
        };
      });
    const chosen = raw.filter((r) => picked[r.name]);
    const total = chosen.reduce((s, r) => s + (r.bytes || 0), 0);
    return {
      accent,
      selecting,
      notSelecting: !selecting,
      items,
      pickedCount: chosen.length,
      pickedSize: total.toFixed(1) + ' MB',
      toggleSelect: () => this.setState({ selecting: !selecting })
    };
  }
}
</script>
</body>
</html>
