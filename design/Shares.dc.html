<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>分享记录</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#16181A;text-decoration:none}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; color: #16181A; font-family: 'Noto Sans SC', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.5px">分享记录</h1>
      <p style="margin: 0; font-size: 13px; color: #5C6066">只保存在这台手机上；删除记录不会让链接失效</p>
    </div>
    <div role="tablist" aria-label="链接状态" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E6E8E3; border-radius: 12px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="height: 40px; border: none; border-radius: 9px; background: {{t.bg}}; box-shadow: {{t.shadow}}; font: inherit; font-size: 14px; font-weight: {{t.weight}}; color: #16181A">{{t.label}}</button>
      </sc-for>
    </div>
  </header>

  <ul style="list-style: none; margin: 0; padding: 0 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow: hidden">
    <sc-for list="{{shares}}" as="s" hint-placeholder-count="3">
      <li style="background: #FFFFFF; border: 1px solid #E3E5DF; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 36px; height: 36px; flex: none; border-radius: 9px; background: {{s.badgeBg}}; color: {{s.badgeFg}}; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; display: flex; align-items: center; justify-content: center">{{s.ext}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</span>
            <span style="font-size: 12px; color: #5C6066">{{s.bucket}}</span>
          </span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #3E4246">
          <span style="padding: 3px 8px; border-radius: 6px; background: {{s.stateBg}}; color: {{s.stateFg}}; font-weight: 500">{{s.left}}</span>
          <span>{{s.issued}}</span>
        </div>
        <div style="display: flex; gap: 8px; border-top: 1px solid #E3E5DF; padding-top: 10px">
          <sc-if value="{{s.active}}" hint-placeholder-val="{{ true }}">
            <button type="button" style="flex: 1; height: 40px; border: 1px solid #D9DBD5; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; color: #16181A">复制链接</button>
          </sc-if>
          <a href="Share.dc.html" style="flex: 1; height: 40px; border: 1px solid #D9DBD5; border-radius: 10px; box-sizing: border-box; background: #FFFFFF; font-size: 13px; color: #16181A; display: flex; align-items: center; justify-content: center">重新生成</a>
          <button type="button" onClick="{{s.remove}}" style="flex: 1; height: 40px; border: 1px solid #D9DBD5; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; color: #3E4246">删除记录</button>
        </div>
      </li>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <li style="padding: 48px 16px; text-align: center; font-size: 14px; color: #5C6066">这里还没有记录。在文件上点「创建分享链接」后会出现在这里。</li>
    </sc-if>
  </ul>

  <nav aria-label="主导航" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 22px; background: #FFFFFF; border-top: 1px solid #E3E5DF">
    <a href="Main.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5C6066">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"></ellipse><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"></path></svg>存储桶</a>
    <a href="Shares.dc.html" aria-current="page" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: {{accent}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>分享记录</a>
    <a href="#" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5C6066">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v14M3 14l4 4 4-4"></path><path d="M17 20V6M13 10l4-4 4 4"></path></svg>传输</a>
    <a href="#" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5C6066">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>设置</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#1D4ED8","#0F766E","#16181A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'active', removed: {} };
  }
  renderVals() {
    const accent = this.props.accent ?? '#C2410C';
    const s = this.state;
    const kinds = { img: ['#FDEBDD', '#9A3412'], vid: ['#E0E7FF', '#1E3A8A'], doc: ['#E2E8F0', '#1E293B'], zip: ['#DCFCE7', '#14532D'] };
    const all = [
      { id: 'a', name: 'IMG_0412.jpg', bucket: 'photos-2026 / trips / kyoto', kind: 'img', ext: 'JPG', left: '剩 7 天', issued: '今天 09:14 签发', active: true },
      { id: 'b', name: 'arashiyama.mov', bucket: 'photos-2026 / trips / kyoto', kind: 'vid', ext: 'MOV', left: '剩 18 小时', issued: '昨天 15:02 签发', active: true },
      { id: 'c', name: 'contract-v3.pdf', bucket: 'shared-docs / legal', kind: 'doc', ext: 'PDF', left: '剩 2 天', issued: '10月30日 签发', active: true },
      { id: 'd', name: 'receipts.zip', bucket: 'photos-2026 / trips / kyoto', kind: 'zip', ext: 'ZIP', left: '10月30日过期', issued: '10月23日 签发', active: false },
      { id: 'e', name: 'q3-report.pdf', bucket: 'shared-docs', kind: 'doc', ext: 'PDF', left: '10月21日过期', issued: '10月20日 签发', active: false }
    ].filter((x) => !s.removed[x.id]);
    const rows = all
      .filter((x) => (s.tab === 'active' ? x.active : !x.active))
      .map((x) => ({
        ...x,
        badgeBg: kinds[x.kind][0],
        badgeFg: kinds[x.kind][1],
        stateBg: x.active ? '#ECEEE9' : '#F4F5F2',
        stateFg: x.active ? '#16181A' : '#5C6066',
        remove: () => this.setState({ removed: { ...s.removed, [x.id]: true } })
      }));
    const activeCount = all.filter((x) => x.active).length;
    const tabs = [
      { id: 'active', label: '有效 ' + activeCount },
      { id: 'ended', label: '已过期 ' + (all.length - activeCount) }
    ].map((t) => {
      const sel = s.tab === t.id;
      return { ...t, selected: sel ? 'true' : 'false', bg: sel ? '#FFFFFF' : 'transparent', weight: sel ? 500 : 400, shadow: sel ? '0 1px 3px rgba(22,24,26,0.15)' : 'none', pick: () => this.setState({ tab: t.id }) };
    });
    return { accent, tabs, shares: rows, empty: rows.length === 0 };
  }
}
</script>
</body>
</html>
